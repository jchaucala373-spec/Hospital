<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital San Francisco</title>
</head>
<body>
    <header>
        <h2 style="text-align: center; color: blue;">Hospital San Francisco</h2>
        <p style="text-align: center; font-size: 20px;">Bienvenido al Hospital Numero 1 del Ecuador</p>
    </header>
    <hr>
    <nav>
        <a href="../index.html">Home</a>
        <a href="../pages/historial.html">Historial Clinico</a>
    </nav>
    <hr>
    <!-- Formulario de registro-->
    <label action="">
        <label for="nombre">Ingrese su nombre:</label>
        <br>
        <input type="text" id ="nombre" placeholder="nombre" size="10" required>
        <br><br>
        <label for="apellido">Ingrese su apellido:</label>
        <br>
        <input type="text" id ="apellido" placeholder="apellido" size="10" required>
        <br><br>
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <br>
        <input type="date" id="fecha_nacimiento" required>
        <br><br>
        <label for="edad">Ingrese su edad:</label>
        <br>
        <input type="number" id="edad" placeholder="edad" min="0" required>
        <br><br>
        <label for="cedula">Ingrese su número de cédula:</label>
        <br>
        <input type="text" id="cedula" placeholder="cédula" required>
        <br><br>
        <label for="telefono">Ingrese su número de teléfono:</label>
        <br>
        <input type="tel" id="telefono" placeholder="teléfono" required>
        <br><br>
        <label for="email">Ingrese su email:</label>
        <br>
        <input type="email" id ="email" placeholder="email" required>
        <br><br>
        <label for="#">Género:</label>
        <br>
        <label for="masculino">
            <input type="radio" id="masculino" name="genero"> Masculino
        </label>
        <label for="femenino">
            <input type="radio" id="femenino" name="genero"> Femenino
        </label>
        <label for="otro">
            <input type="radio" id="otro" name="genero"> Otro
        <br><br>
        <label for="nivel_dolor">Escala Subjetiva del Dolor (1 = Mínimo, 10 = Insoportable):</label>
        <br>
            <input type="range" id="nivel_dolor" name="nivel_dolor" min="1" max="10" value="5"> 10
        <label for="ciudad">Selecciones su ciudad:</label>
        <select name="ciudad" id="ciudad">
            <option value="opcion" disabled selected>Seleccionar opción</option>
          <option value="quito">Quito</option>
          <option value="guayaquil">Guayaquil</option>
          <option value="cuenca">Cuenca</option>
          <option value="ibarra">Ibarra</option>
        </select>
        <br><br>
        <label for="foto">Seleccione su foto:</label>
        <br>
        <input type="file" id="foto">
        <br><br>
        <label for="comentarios">Deje sus comentarios:</label>
        <br>
        <textarea name="comentarios" id="comentarios" cols="30" rows="5" placeholder="Escriba sus comentarios aquí..."></textarea>
        <br><br>
        <!--Botonoes
        Button = botón simple, sin una funcionalidad
        Submit = botón que envía datos (DB)
        Reset = Limpiar el formulario
        -->
       <button>Botón simple</button>
       <input type="submit" value="Enviar">
       <button type="reset">Limpiar</button>
    </form>
</body>
</html>
